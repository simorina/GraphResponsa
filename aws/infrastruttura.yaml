AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GraphResponsa - infrastruttura di produzione.
  Il grafo resta su Neo4j Aura (gestito, fuori da questo stack). Qui vivono il
  backend su Fargate, il frontend su S3 dietro CloudFront, l'identita' su
  Cognito e lo stato applicativo su DynamoDB.

# ===========================================================================
# Ordine di distribuzione
#   1. creare lo stack con NumeroTask = 0  (l'immagine non esiste ancora)
#   2. costruire e spingere l'immagine su ECR
#   3. aggiornare lo stack con NumeroTask = 1
# Partire con 1 farebbe fallire la stabilizzazione del servizio e rotolare
# indietro tutto lo stack per un motivo banale.
# ===========================================================================

Parameters:
  NomeProgetto:
    Type: String
    Default: graphresponsa
    Description: Prefisso per i nomi delle risorse (minuscolo, S3 non tollera maiuscole)

  NumeroTask:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
    Description: 0 alla prima creazione, 1 dopo aver spinto l'immagine su ECR

  TagImmagine:
    Type: String
    Default: latest
    Description: Tag dell'immagine su ECR

  CpuTask:
    Type: String
    # 256 dal 02/10: in 14 giorni di produzione, su 20.159 minuti, solo 21 sono
    # andati oltre il 25% di 0,5 vCPU, e quasi tutti all'avvio dopo un rilascio.
    # Fuori dagli avvii il task non supera ~0,17 vCPU. Dimezzare la CPU fa
    # risparmiare ~8,4 dollari al mese, il 14% della spesa AWS.
    # Lo stack memorizza ancora 512: chi lo riaggiorna passi CpuTask=256.
    Default: '256'
    AllowedValues: ['256', '512', '1024']
    Description: Unita' di CPU (256 = 0,25 vCPU). Il container aspetta le API, non calcola

  MemoriaTask:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '4096']
    Description: MiB di memoria

  PrefissiCloudFront:
    Type: String
    Default: pl-a3a144ca
    Description: >-
      Lista gestita degli IP con cui CloudFront contatta le origini
      (com.amazonaws.global.cloudfront.origin-facing). L'identificativo cambia
      da regione a regione: pl-a3a144ca e' quello di eu-central-1.

  LimiteRichiesteGiorno:
    Type: Number
    Default: 100
    Description: Quante consultazioni puo' fare un utente in un giorno

  LimiteCostoMese:
    Type: String
    Default: '20'
    Description: Tetto di spesa in dollari per utente al mese, verso Anthropic e Voyage

  LimitiFascia:
    Type: String
    Default: 'prova:10:2,base:50:5,pro:100:25'
    Description: >-
      I tetti per fascia, nella forma gruppo:consultazioni-al-giorno:dollari-al-mese.
      Il gruppo e' un gruppo del pool Cognito. Chi non ne ha ricade su
      LimiteRichiesteGiorno e LimiteCostoMese.

  FusoOrario:
    Type: String
    Default: 'Europe/Rome'
    Description: >-
      Il fuso in cui si data il giorno dei contatori. In UTC l'azzeramento
      cadrebbe all'01:00 d'inverno e alle 02:00 d'estate.

  GiorniConservazioneChat:
    Type: Number
    Default: 90
    Description: Dopo quanti giorni il TTL cancella una conversazione

  DemoMittente:
    Type: String
    Default: rinaldisimone8@gmail.com
    Description: >-
      La casella da cui partono gli avvisi di "Prenota una demo", via SMTP
      (Gmail finche' non ce n'e' una del progetto). La sua password per le app
      va nel segreto, alla voce DEMO_SMTP_PASSWORD.

  DemoDestinatari:
    Type: String
    Default: rinaldisimone8@gmail.com
    Description: Dove arrivano le richieste di demo; piu' indirizzi separati da virgola

  Modello:
    Type: String
    Default: deepseek-v4.1-flash
    Description: >-
      Il modello dell'agente (src/agente/agente.py). I modelli qwen, deepseek,
      kimi e glm passano dal gateway e vogliono QWEN_API_KEY nel segreto
      ${NomeProgetto}/produzione; claude-* vuole ANTHROPIC_API_KEY.

Resources:

  # =========================================================================
  # Rete
  #
  # Due subnet pubbliche in due zone, per i task: escono su internet con il
  # loro IP pubblico. Niente NAT Gateway: costerebbe ~33 $/mese, quanto tutto
  # il resto dello stack, e l'unica cosa che aggiungerebbe e' togliere l'IP
  # pubblico a un task gia' irraggiungibile dall'esterno grazie al security
  # group.
  # Due subnet private, senza rotta verso internet, per il solo ALB interno,
  # che pretende almeno due zone.
  # =========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${NomeProgetto}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  CollegamentoGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  TabellaRotte:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  RottaInternet:
    Type: AWS::EC2::Route
    DependsOn: CollegamentoGateway
    Properties:
      RouteTableId: !Ref TabellaRotte
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AssociazioneRotteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref TabellaRotte

  AssociazioneRotteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref TabellaRotte

  # Qui vive l'ALB interno. CloudFront lo raggiunge con la VPC origin,
  # tramite interfacce di rete che crea lui stesso in queste subnet: niente
  # IP pubblici, e il tratto CloudFront -> ALB resta dentro la rete di AWS.
  SubnetPrivataA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${NomeProgetto}-privata-a'

  SubnetPrivataB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${NomeProgetto}-privata-b'

  # Solo la rotta locale, che AWS aggiunge da se'.
  TabellaPrivata:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${NomeProgetto}-privata'

  AssociazionePrivataA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPrivataA
      RouteTableId: !Ref TabellaPrivata

  AssociazionePrivataB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPrivataB
      RouteTableId: !Ref TabellaPrivata

  # =========================================================================
  # Security group
  #
  # L'ALB e' interno, senza IP pubblici: sulla 80 accetta solo gli IP di
  # CloudFront, che lo raggiunge con la VPC origin. Il listener rifiuta
  # comunque con 403 cio' che non porta l'intestazione segreta di CloudFront.
  # Il task accetta solo dall'ALB.
  # =========================================================================

  SgBilanciatore:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Bilanciatore interno: entra solo CloudFront, tramite la VPC origin'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Gli IP di CloudFront, e non il gruppo che CloudFront crea per la VPC
        # origin: cosi' l'ALB vede arrivare CloudFront come quando era
        # pubblico, la catena X-Forwarded-For non cambia e il backend continua
        # a trovare l'IP del visitatore al penultimo posto.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref PrefissiCloudFront
          Description: CloudFront (VPC origin)

  SgTask:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Il container accetta solo dal bilanciatore
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref SgBilanciatore
          Description: Solo dal bilanciatore

  # =========================================================================
  # Registro immagini
  # =========================================================================

  Registro:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref NomeProgetto
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Tiene le ultime 10 immagini",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": {"type": "expire"}
            }]
          }

  # =========================================================================
  # Stato applicativo su DynamoDB
  #
  # Le conversazioni NON stanno su Aura: 03_load.py --reset esegue
  # MATCH (n) DETACH DELETE n, e cancellerebbe le chat di tutti a ogni
  # ricarico del grafo. Aura tiene la normativa, DynamoDB le persone.
  # =========================================================================

  TabellaCheckpoint:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-checkpoint'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: thread_id
          AttributeType: S
        - AttributeName: checkpoint_id
          AttributeType: S
      KeySchema:
        - AttributeName: thread_id
          KeyType: HASH
        - AttributeName: checkpoint_id
          KeyType: RANGE
      # Il TTL resta dichiarato ma per ora e' inerte: la libreria non scrive
      # l'attributo `scadenza`, quindi niente scade da solo. I checkpoint sono
      # di pochi KB e a questi volumi la crescita e' trascurabile per anni; se
      # un domani dara' fastidio, si pota con un lavoro periodico.
      TimeToLiveSpecification:
        AttributeName: scadenza
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TabellaScritture:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-scritture'
      BillingMode: PAY_PER_REQUEST
      # Lo schema lo detta la libreria langgraph-checkpoint-dynamodb, non noi:
      # Write.to_dynamodb_item() scrive esattamente queste due chiavi. Con nomi
      # diversi il servizio esploderebbe alla prima domanda.
      AttributeDefinitions:
        - AttributeName: thread_id_checkpoint_id_checkpoint_ns
          AttributeType: S
        - AttributeName: task_id_idx
          AttributeType: S
      KeySchema:
        - AttributeName: thread_id_checkpoint_id_checkpoint_ns
          KeyType: HASH
        - AttributeName: task_id_idx
          KeyType: RANGE

  TabellaUtenti:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-utenti'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: utente
          AttributeType: S
      KeySchema:
        - AttributeName: utente
          KeyType: HASH

  TabellaConversazioni:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-conversazioni'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: utente
          AttributeType: S
        - AttributeName: conversazione
          AttributeType: S
        - AttributeName: aggiornata
          AttributeType: S
      KeySchema:
        - AttributeName: utente
          KeyType: HASH
        - AttributeName: conversazione
          KeyType: RANGE
      LocalSecondaryIndexes:
        # Per mostrare l'elenco in ordine di ultima attivita' senza ordinare
        # lato applicazione.
        - IndexName: per-aggiornamento
          KeySchema:
            - AttributeName: utente
              KeyType: HASH
            - AttributeName: aggiornata
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TabellaRiscontri:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-riscontri'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversazione
          AttributeType: S
        - AttributeName: messaggio
          AttributeType: S
        - AttributeName: giudizio
          AttributeType: S
        - AttributeName: creato
          AttributeType: S
      KeySchema:
        - AttributeName: conversazione
          KeyType: HASH
        - AttributeName: messaggio
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # L'uso vero della tabella: leggere in ordine di tempo cosa non ha
        # funzionato, senza scandire tutto.
        - IndexName: giudizio-creato
          KeySchema:
            - AttributeName: giudizio
              KeyType: HASH
            - AttributeName: creato
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # "Prenota una demo" dalla pagina di presentazione (src/servizio/demo.py).
  # Una riga per richiesta; poche decine, si leggono per intero.
  TabellaDemo:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-richieste-demo'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: richiesta
          AttributeType: S
      KeySchema:
        - AttributeName: richiesta
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TabellaConsumi:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${NomeProgetto}-consumi'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: utente
          AttributeType: S
        - AttributeName: periodo
          AttributeType: S
      KeySchema:
        - AttributeName: utente
          KeyType: HASH
        - AttributeName: periodo
          KeyType: RANGE
      # I contatori vecchi non servono a nessuno: si cancellano da soli.
      TimeToLiveSpecification:
        AttributeName: scadenza
        Enabled: true

  # =========================================================================
  # Identita'
  #
  # Il servizio non puo' restare aperto: chiamerebbe Anthropic con la chiave
  # dell'esercente, e chiunque trovi l'URL spenderebbe soldi altrui.
  # Pool a inviti: niente registrazione libera.
  # =========================================================================

  PoolUtenti:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${NomeProgetto}-utenti'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # solo su invito
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  ClientPool:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${NomeProgetto}-web'
      UserPoolId: !Ref PoolUtenti
      # Nessun segreto: il client e' un'applicazione nel browser, non puo'
      # custodire niente. Il flusso e' authorization code con PKCE.
      GenerateSecret: false
      # Accesso con email e password dentro l'applicazione, senza passare dalla
      # Hosted UI. La password viaggia a Cognito su TLS: SRP eviterebbe di
      # mandarla del tutto, ma richiede una libreria di crittografia nel
      # browser per un guadagno che, con TLS gia' obbligatorio, e' marginale.
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub 'https://${Distribuzione.DomainName}/'
        - 'http://localhost:5173/'
      LogoutURLs:
        - !Sub 'https://${Distribuzione.DomainName}/'
        - 'http://localhost:5173/'
      AccessTokenValidity: 8
      IdTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  DominioPool:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${NomeProgetto}-${AWS::AccountId}'
      UserPoolId: !Ref PoolUtenti

  # Le fasce di consumo, come gruppi del pool.
  #
  # Il gruppo viaggia gia' dentro l'ID token come `cognito:groups`: il servizio
  # lo legge da li' e non deve interrogare nessuna tabella a ogni domanda. I
  # numeri non stanno qui ma nel parametro LimitiFascia, cosi' si ritoccano al
  # rilascio senza rifare l'immagine.
  #
  # Chi non sta in nessun gruppo ricade sui limiti globali: aggiungere un
  # utente non e' un passaggio obbligato per farlo funzionare.
  FasciaProva:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: prova
      Description: 10 consultazioni al giorno, 2 dollari al mese
      UserPoolId: !Ref PoolUtenti
      Precedence: 30

  FasciaBase:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: base
      Description: 50 consultazioni al giorno, 5 dollari al mese
      UserPoolId: !Ref PoolUtenti
      Precedence: 20

  FasciaPro:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: pro
      Description: 100 consultazioni al giorno, 25 dollari al mese
      UserPoolId: !Ref PoolUtenti
      Precedence: 10

  # =========================================================================
  # Segreti
  #
  # Creato vuoto: i valori si mettono a mano dopo, e non passano mai da qui.
  # Un segreto scritto nel template finirebbe negli eventi dello stack.
  # =========================================================================

  Segreti:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${NomeProgetto}/produzione'
      Description: Credenziali Aura e chiavi API. Da popolare a mano dopo la creazione.
      SecretString: |
        {
          "NEO4J_URI": "DA_COMPILARE",
          "NEO4J_USERNAME": "DA_COMPILARE",
          "NEO4J_PASSWORD": "DA_COMPILARE",
          "NEO4J_DATABASE": "neo4j",
          "ANTHROPIC_API_KEY": "DA_COMPILARE",
          "VOYAGE_API_KEY": "DA_COMPILARE"
        }

  # =========================================================================
  # Frontend statico
  # =========================================================================

  BucketFrontend:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${NomeProgetto}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # =========================================================================
  # Archivio delle fonti
  #
  # I PDF originali e i JSON parsati esistono solo sul disco di chi ha fatto
  # lo scraping. Riacquisirli e' dieci ore di richieste al portale con tre
  # secondi di pausa fra l'una e l'altra: non e' una copia che si rifa' in
  # fretta.
  #
  # DeletionPolicy Retain: se un giorno lo stack viene cancellato, questo
  # bucket resta. Il resto e' ricreabile in un quarto d'ora, l'archivio no.
  # =========================================================================

  BucketArchivio:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${NomeProgetto}-archivio-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # I PDF non cambiano mai: il versionamento non serve a tracciare
      # modifiche, serve a sopravvivere a una cancellazione per sbaglio.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: verso-accesso-infrequente
            Status: Enabled
            # Dati scritti una volta e letti di rado: dopo un mese non c'e'
            # ragione di pagarli a tariffa piena.
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          - Id: pota-le-versioni-vecchie
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90

  PolicyBucketFrontend:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketFrontend
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${BucketFrontend.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuzione}'

  ControlloAccessoOrigine:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${NomeProgetto}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # =========================================================================
  # Bilanciatore
  # =========================================================================

  # Interno dal 02/10. Pubblico, com'era prima, costava 2 IP (7,3 $/mese) e
  # lasciava il tratto CloudFront -> ALB in HTTP verso un indirizzo pubblico.
  Bilanciatore:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets:
        - !Ref SubnetPrivataA
        - !Ref SubnetPrivataB
      SecurityGroups:
        - !Ref SgBilanciatore
      LoadBalancerAttributes:
        # Lo streaming SSE puo' restare aperto a lungo mentre l'agente lavora:
        # i 60 secondi predefiniti lo taglierebbero a meta'.
        - Key: idle_timeout.timeout_seconds
          Value: '300'

  GruppoBersaglio:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      # L'health check NON deve interrogare Neo4j: se Aura ha un singhiozzo,
      # l'ALB ucciderebbe e ricreerebbe i container in ciclo, trasformando un
      # problema del database in un'interruzione totale.
      HealthCheckPath: /salute
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  Ascoltatore:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Bilanciatore
      Port: 80
      Protocol: HTTP
      # Chi arriva senza l'intestazione segreta di CloudFront viene respinto.
      # Ora che l'ALB e' interno e accetta solo CloudFront e' una seconda
      # difesa, non la sola.
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Passare da CloudFront.

  RegolaOrigineVerificata:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Ascoltatore
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origine-Verificata
            Values:
              - !Select [2, !Split ['/', !Ref AWS::StackId]]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GruppoBersaglio

  # =========================================================================
  # CloudFront
  # =========================================================================

  # La strada privata da CloudFront all'ALB interno. Il dispiegamento richiede
  # fino a 15 minuti.
  OrigineVpc:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub '${NomeProgetto}-alb-interno'
        Arn: !Ref Bilanciatore
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  Distribuzione:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${NomeProgetto} - frontend e API'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100      # Europa e Nord America: basta e avanza
        Origins:
          - Id: origineS3
            DomainName: !GetAtt BucketFrontend.RegionalDomainName
            OriginAccessControlId: !GetAtt ControlloAccessoOrigine.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: origineAlbInterno
            DomainName: !GetAtt Bilanciatore.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt OrigineVpc.Id
              # Predefinito 30 s, massimo 120. L'agente puo' impiegare di piu'
              # prima del primo byte su una consultazione con molti giri di
              # strumenti.
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origine-Verificata
                HeaderValue: !Select [2, !Split ['/', !Ref AWS::StackId]]

        DefaultCacheBehavior:
          TargetOriginId: origineS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized

        CacheBehaviors:
          # CachingDisabled non e' un dettaglio di prestazioni: senza, CloudFront
          # bufferizza la risposta e lo streaming SSE arriva tutto insieme alla
          # fine. Nessun errore, solo un'esperienza che sembra lentissima.
          - PathPattern: /chat
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            Compress: false
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad         # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          - PathPattern: /riscontro
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /richiesta-demo
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /recupero-password
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /conversazioni*
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          # /salute non aveva una regola, quindi non arrivava mai all'ALB:
          # cadeva sul bucket, che rispondeva 403, e la vecchia riscrittura
          # degli errori lo trasformava in 200 con la pagina dell'applicazione.
          # Ogni verifica esterna leggeva quindi index.html credendo di
          # interrogare il backend - un controllo di salute che non poteva
          # fallire, che e' il tipo di controllo peggiore.
          - PathPattern: /salute
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /stato
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          # Il PDF originale della norma, riletto dal portale del Consiglio.
          # Senza questa regola il percorso cadeva nel comportamento
          # predefinito, cioe' il bucket, e /documenti/D-6-1960 restituiva la
          # pagina dell'applicazione invece del documento: HTTP 200 e
          # text/html, un guasto che non si vede finche' non si guarda il tipo.
          #
          # Qui la cache si USA, al contrario degli altri percorsi: un atto
          # pubblicato non cambia piu', l'endpoint dichiara gia'
          # max-age=86400, e senza cache ogni apertura ripasserebbe dal
          # portale - che per gli atti con allegati significa rileggere
          # diciassette megabyte a ogni clic.
          - PathPattern: /documenti/*
            TargetOriginId: origineAlbInterno
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6         # CachingOptimized
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        # NIENTE CustomErrorResponses, ed e' una scelta.
        #
        # C'era la solita regola da applicazione a pagina singola: 403 e 404
        # riscritti in 200 con /index.html, perche' "un percorso sconosciuto
        # non e' un file mancante, e' una rotta del client". Due problemi.
        #
        # Primo, non serve: questa UI non ha un router, non esistono rotte
        # profonde da servire, e la radice arriva gia' da DefaultRootObject.
        #
        # Secondo, e' distribuzione-wide: CloudFront la applica anche alle
        # risposte dell'ALB, quindi riscriveva gli errori dell'API. Misurato in
        # produzione: POST /chat con la conversazione di un altro utente
        # tornava 200 e la pagina HTML invece di 403, e il ramo che il frontend
        # ha per quel caso era codice morto - riceveva HTML e provava a
        # leggerlo come flusso SSE. Lo stesso valeva per /documenti su una
        # norma inesistente.
        #
        # Senza la regola, un percorso ignoto rende l'errore vero del bucket e
        # l'API i propri codici. Un errore onesto vale piu' di una pagina
        # servita al posto suo.

  # =========================================================================
  # Ruoli
  # =========================================================================

  RuoloEsecuzione:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: LetturaSegreti
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref Segreti

  # Il ruolo dell'applicazione: puo' toccare le proprie tabelle e nient'altro.
  RuoloTask:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StatoApplicativo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt TabellaCheckpoint.Arn
                  - !GetAtt TabellaScritture.Arn
                  - !GetAtt TabellaUtenti.Arn
                  - !GetAtt TabellaConversazioni.Arn
                  - !GetAtt TabellaRiscontri.Arn
                  - !GetAtt TabellaConsumi.Arn
                  - !Sub '${TabellaConversazioni.Arn}/index/*'
                  - !Sub '${TabellaRiscontri.Arn}/index/*'
        # La password smarrita (src/servizio/recupero.py): una password
        # temporanea per email a chi l'ha persa. Solo sul proprio pool, e solo
        # le tre operazioni che servono.
        - PolicyName: RecuperoPassword
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminCreateUser
                Resource: !GetAtt PoolUtenti.Arn
        # "Prenota una demo": scrivere le richieste, nient'altro.
        - PolicyName: RichiesteDemo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt TabellaDemo.Arn

  # =========================================================================
  # Servizio
  # =========================================================================

  RegistroLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${NomeProgetto}'
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${NomeProgetto}-cluster'

  DefinizioneTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${NomeProgetto}-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref CpuTask
      Memory: !Ref MemoriaTask
      ExecutionRoleArn: !GetAtt RuoloEsecuzione.Arn
      TaskRoleArn: !GetAtt RuoloTask.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Registro}:${TagImmagine}'
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: MODELLO
              Value: !Ref Modello
            - Name: TABELLA_DEMO
              Value: !Ref TabellaDemo
            - Name: DEMO_MITTENTE
              Value: !Ref DemoMittente
            - Name: DEMO_DESTINATARI
              Value: !Ref DemoDestinatari
            - Name: TABELLA_CHECKPOINT
              Value: !Ref TabellaCheckpoint
            - Name: TABELLA_SCRITTURE
              Value: !Ref TabellaScritture
            - Name: TABELLA_UTENTI
              Value: !Ref TabellaUtenti
            - Name: TABELLA_CONVERSAZIONI
              Value: !Ref TabellaConversazioni
            - Name: TABELLA_RISCONTRI
              Value: !Ref TabellaRiscontri
            - Name: TABELLA_CONSUMI
              Value: !Ref TabellaConsumi
            - Name: LIMITE_RICHIESTE_GIORNO
              Value: !Ref LimiteRichiesteGiorno
            - Name: LIMITE_COSTO_MESE
              Value: !Ref LimiteCostoMese
            - Name: LIMITI_FASCIA
              Value: !Ref LimitiFascia
            - Name: FUSO_ORARIO
              Value: !Ref FusoOrario
            - Name: COGNITO_POOL_ID
              Value: !Ref PoolUtenti
            - Name: COGNITO_CLIENT_ID
              Value: !Ref ClientPool
            - Name: REGIONE
              Value: !Ref AWS::Region
            - Name: GIORNI_CONSERVAZIONE_CHAT
              Value: !Ref GiorniConservazioneChat
          # I segreti arrivano da Secrets Manager, non dall'immagine.
          Secrets:
            - Name: NEO4J_URI
              ValueFrom: !Sub '${Segreti}:NEO4J_URI::'
            - Name: NEO4J_USERNAME
              ValueFrom: !Sub '${Segreti}:NEO4J_USERNAME::'
            - Name: NEO4J_PASSWORD
              ValueFrom: !Sub '${Segreti}:NEO4J_PASSWORD::'
            - Name: NEO4J_DATABASE
              ValueFrom: !Sub '${Segreti}:NEO4J_DATABASE::'
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub '${Segreti}:ANTHROPIC_API_KEY::'
            - Name: VOYAGE_API_KEY
              ValueFrom: !Sub '${Segreti}:VOYAGE_API_KEY::'
            # Il gateway di DeepSeek e Qwen. La voce va aggiunta a mano al
            # segreto: il SecretString qui sopra vale solo alla creazione, e
            # cambiarlo sovrascriverebbe le chiavi vere.
            - Name: QWEN_API_KEY
              ValueFrom: !Sub '${Segreti}:QWEN_API_KEY::'
            # La password per le app della casella DemoMittente. Come per
            # QWEN_API_KEY, la voce si aggiunge a mano al segreto.
            - Name: DEMO_SMTP_PASSWORD
              ValueFrom: !Sub '${Segreti}:DEMO_SMTP_PASSWORD::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RegistroLog
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Servizio:
    Type: AWS::ECS::Service
    DependsOn: RegolaOrigineVerificata
    Properties:
      ServiceName: !Sub '${NomeProgetto}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref DefinizioneTask
      DesiredCount: !Ref NumeroTask
      LaunchType: FARGATE
      # 120 e non 60: con 0,25 vCPU l'avvio (gli import di langchain) richiede
      # il doppio, e il task non va dato per malato prima di essere partito.
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          # IP pubblico per raggiungere Aura, Anthropic ed ECR senza NAT.
          # L'ingresso resta chiuso: lo consente solo il security group dell'ALB.
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref SgTask]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref GruppoBersaglio

  # Cablato e inattivo: e' la differenza fra "ampliabile" e "da rifare".
  BersaglioScalabile:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: 1
      MaxCapacity: 4
      ResourceId: !Sub 'service/${Cluster}/${Servizio.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  PoliticaScalabilita:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${NomeProgetto}-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BersaglioScalabile
      TargetTrackingScalingPolicyConfiguration:
        # NON la CPU. Questa applicazione non calcola: aspetta Anthropic e Aura
        # per decine di secondi, tenendo occupato un thread del pool (40) senza
        # scaldare il processore. Il servizio si pianta quando i thread
        # finiscono, con la CPU ancora intorno al 5%: un allarme sulla CPU non
        # scatterebbe mai.
        # Le richieste in corso per container, invece, salgono davvero.
        TargetValue: 12
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${Bilanciatore.LoadBalancerFullName}/${GruppoBersaglio.TargetGroupFullName}'
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  UrlPubblico:
    Description: L'indirizzo del servizio
    Value: !Sub 'https://${Distribuzione.DomainName}'

  UrlRegistro:
    Description: Dove spingere l'immagine
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Registro}'

  BucketFrontend:
    Description: Dove caricare il frontend compilato
    Value: !Ref BucketFrontend

  BucketArchivio:
    Description: PDF originali e JSON parsati delle norme
    Value: !Ref BucketArchivio

  IdDistribuzione:
    Description: Serve per invalidare la cache dopo un aggiornamento della UI
    Value: !Ref Distribuzione

  DominioCognito:
    Description: Hosted UI per l'accesso
    Value: !Sub 'https://${DominioPool}.auth.${AWS::Region}.amazoncognito.com'

  IdPoolUtenti:
    Value: !Ref PoolUtenti

  IdClientCognito:
    Value: !Ref ClientPool

  NomeSegreto:
    Description: Da popolare a mano prima di portare NumeroTask a 1
    Value: !Ref Segreti

  TabellaConsumi:
    Description: Contabilita' per utente, con i tetti applicati
    Value: !Ref TabellaConsumi
