version: '3.8'

services:
  # ==========================================
  # Database a Grafo: Neo4j Community Edition
  # ==========================================
  neo4j:
    image: neo4j:5.26.0-community
    container_name: graphresponsa-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7687:7687"   # Bolt protocol (solo localhost / rete interna)
      - "127.0.0.1:7474:7474"   # Neo4j Browser (solo localhost)
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Password obbligatoria}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=3G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - internal_network

  # ==========================================
  # Backend API & Web Interface (FastAPI + React)
  # ==========================================
  app:
    build:
      context: ..
      dockerfile: aws/Dockerfile
    container_name: graphresponsa-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?API Key Claude obbligatoria}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:?API Key Voyage AI obbligatoria}
    volumes:
      - app_data:/app/data
    networks:
      - internal_network
      - web_network

  # ==========================================
  # Reverse Proxy & SSL Automatico (Caddy)
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: graphresponsa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web_network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  app_data:
  caddy_data:
  caddy_config:

networks:
  internal_network:
    driver: bridge
    internal: false
  web_network:
    driver: bridge
