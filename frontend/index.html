<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: si disegna anche sotto la barra gesti, e i bordi
         di sicurezza li gestisce il CSS (env(safe-area-inset-*)).
         interactive-widget=resizes-content: all'apertura della tastiera la
         pagina si accorcia invece di scorrere sotto, cosi' l'area di
         scrittura resta visibile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Il colore della barra del browser segue la pagina: bianco nel chiaro.
         Col tema scuro src/tema.ts ne aggiunge uno in cima, che vince perche'
         viene prima. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Il tema scelto si applica prima del primo disegno: se lo facesse
         React, chi ha scelto lo scuro vedrebbe un lampo bianco a ogni
         apertura. Si parte chiari: lo scuro solo se scelto a mano, e solo con
         una sessione salvata, perche' senza si finisce sulla pagina d'accesso,
         che e' sempre chiara. -->
    <script>
      try {
        if (localStorage.getItem('gr_tema') === 'scuro' && localStorage.getItem('gr_sessione'))
          document.documentElement.dataset.tema = 'scuro';
      } catch (e) {}
    </script>
    <meta name="description" content="Responsa, l’intelligenza artificiale dedicata alla consultazione della legge sammarinese: ogni risposta cita articolo e comma delle fonti." />
    <title>Responsa — La legge sammarinese, consultata con l’intelligenza artificiale</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="grain bg-canvas text-ink font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
