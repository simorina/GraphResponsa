<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Il Sigillo di Responsa (src/components/Sigillo.tsx) come icona: le tre
       torri del Titano in chiaro su azzurro, i punti della corona e il
       cartiglio in oro. Le torri sono piene e non a contorno come nel sito:
       a 16 pixel i contorni si impastavano in una macchia bianca, piene
       restano tre torri distinte. I punti stanno un po' piu' in alto per lo
       stesso motivo. Il fondo pieno regge sia le schede chiare sia le scure. -->
  <rect width="32" height="32" rx="7.5" fill="#0a6b9f"/>
  <g transform="translate(1.2 1.45) scale(1.48)">
    <g fill="#f4f8fb">
      <path d="M4.5 15.1V9.5L6 7.9l1.5 1.6v5.6z"/>
      <path d="M8.8 15.1V7.5L10.3 5.9l1.5 1.6v7.6z"/>
      <path d="M13.1 15.1V10.4l1.4-1.5 1.4 1.5v4.7z"/>
    </g>
    <g fill="#d4af37">
      <circle cx="6" cy="5.9" r="0.9"/>
      <circle cx="10.3" cy="3.9" r="0.9"/>
      <circle cx="14.5" cy="6.9" r="0.9"/>
    </g>
    <path d="M3.3 15.9h13.4" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
